// 作为初始化脚本验证所有渠道的构建约定，不读取或输出签名凭据。
gradle.beforeProject { project ->
    if (project.path != ':app') {
        return
    }
    def variants = []
    project.tasks.register('verifyBuildConfiguration') {
        group = 'verification'
        description = 'Verify channel, APK naming, SDK and signing compatibility'
        doLast {
            def android = project.extensions.getByName('android')
            def version = project.rootProject.siyuanVersionName
            def channels = ['cn', 'googleplay', 'huawei', 'official']
            assert variants.collect { it.name }.sort() == channels.collectMany { channel ->
                ["${channel}Debug".toString(), "${channel}Release".toString()]
            }.sort()
            assert android.compileSdk == 36
            assert android.defaultConfig.minSdk == 26
            assert android.defaultConfig.targetSdk == 36
            assert android.compileOptions.sourceCompatibility == JavaVersion.VERSION_1_8
            assert android.compileOptions.targetCompatibility == JavaVersion.VERSION_1_8
            assert project.findProperty("android.defaults.buildfeatures.resvalues") == "true"
            assert android.buildTypes.release.signingConfig.name == 'siyuanConfig'
            assert android.buildTypes.release.minifyEnabled
            assert android.buildTypes.release.shrinkResources
            assert project.extensions.getByName('base').archivesName.get() == "rw-notes-${version}"
            android.productFlavors.each { flavor ->
                assert flavor.ndk.abiFilters == ['arm64-v8a'] as Set
                assert flavor.manifestPlaceholders.CHANNEL == flavor.name
            }
            variants.each { variant ->
                def debug = variant.buildType.name == 'debug'
                assert variant.applicationId == "com.parendum.rwnotes${debug ? '.debug' : ''}"
                assert variant.mergedFlavor.buildConfigFields.CHANNEL.value == "\"${variant.flavorName}\""
                def appName = (android.buildTypes.getByName(variant.buildType.name).resValues.values().find { it.name == 'app_name' } ?: android.productFlavors.getByName(variant.flavorName).resValues.values().find { it.name == 'app_name' }).value
                def expectedName = debug ? 'RW Notes Debug' : 'RW Notes'
                assert appName == expectedName
                variant.outputs.each { output ->
                    assert variant.versionCode == project.rootProject.siyuanVersionCode
                    assert variant.versionName == version
                    def base = "rw-notes-${version}-${variant.flavorName}-${variant.buildType.name}"
                    def name = output.outputFileName
                    if (debug) {
                        assert name.startsWith(base + '-') && name.substring(base.length()) ==~ /-\d{14}\.apk/
                    } else {
                        assert name == "${base}.apk"
                    }
                }
            }
            println "Verified ${variants.size()} variants: APK names, channels, labels, SDKs, ABI and signing configuration"
        }
    }
    project.afterEvaluate {
        project.extensions.getByName('android').applicationVariants.all { variant -> variants.add(variant) }
    }
}
